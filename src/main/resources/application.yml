spring:
  application:
    name: auditlens

  datasource:
    url: jdbc:h2:mem:auditlens;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql

  h2:
    console:
      enabled: true
      path: /h2-console

  jackson:
    serialization:
      indent-output: false
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.auditlens: INFO
    org.springframework.jdbc.core: WARN
